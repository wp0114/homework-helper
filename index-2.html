<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>功课翻译小助手</title><style>body{font-family:system-ui,'Noto Sans SC',sans-serif;background:#f7f9fc;color:#182333;margin:0}main{max-width:680px;margin:auto;padding:20px 16px 70px}h1{font-size:25px;margin:12px 0 4px}.sub{color:#64748b;margin:0 0 20px}.panel{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 18px #1b3a5b0b}button,.upload{border:0;border-radius:13px;padding:14px 18px;font-size:16px;font-weight:650;cursor:pointer;background:#e9f5ed;color:#176b40;display:inline-block}button.primary,.upload.primary{background:#16834b;color:white;width:100%;box-sizing:border-box;text-align:center}button:disabled{opacity:.5}textarea{box-sizing:border-box;width:100%;border:1px solid #d9e0e8;border-radius:12px;padding:12px;font-size:17px;min-height:110px;resize:vertical}#photo{max-width:100%;max-height:240px;object-fit:contain;border-radius:12px;margin:12px auto;display:none}.hide{display:none!important}.line{display:flex;flex-wrap:wrap;gap:12px 10px;align-items:end;line-height:1.5;margin:12px 0 20px}.word{display:flex;flex-direction:column;align-items:center;gap:3px;background:#f5f8fa;border-radius:9px;padding:7px 9px;max-width:100%;overflow-wrap:anywhere}.pinyin{color:#16834b;font-size:13px;min-height:18px}.han{color:#1d6d4c;font-size:15px}.orig{font-size:20px;font-weight:650}.zh .orig{font-size:23px}.muted{color:#667789;font-size:13px}.status{font-size:14px;color:#54687a;white-space:pre-wrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}h2{font-size:18px}#translated{font-size:18px;line-height:1.8}.tip{background:#f1f8ff;padding:13px;border-radius:12px;line-height:1.7}.foot{color:#64748b;font-size:12px;line-height:1.7}input[type=file]{display:none}</style></head><body><main><h1>📚 功课翻译小助手</h1><p class="sub">拍功课 · 看意思 · 点字听发音</p><section class="panel"><label class="upload primary" for="file">📷 拍照或上传功课</label><input id="file" type="file" accept="image/*" capture="environment"><img id="photo" alt="功课照片"><div class="actions"><select id="ocrLang" aria-label="功课语言" style="flex:1;padding:12px;border:1px solid #d9e0e8;border-radius:12px;font-size:16px"><option value="eng">英文 / 国文（推荐）</option><option value="chi_sim+eng">中文 / 混合文字</option></select><button id="retryOCR" type="button">🔄 重新识别</button></div><p id="ocrstatus" class="status">也可以直接在下面输入或修改题目。</p><textarea id="source" placeholder="拍照后会识别文字，也可以自己输入华文、英文或国文……"></textarea><div class="actions"><button id="analyze" class="primary">✨ 显示翻译 / 拼音</button></div></section><section id="result" class="panel hide"><h2>📖 逐字学习 <span id="detected" class="muted"></span></h2><div id="words"></div><h2>整句中文意思</h2><div id="translated"></div><div class="actions"><button id="speakAll">🔊 朗读原文</button><button id="speakZh">🔊 朗读中文</button></div><p class="muted">点击上方任意单词或汉字，也可以听发音。</p><div class="actions"><button id="help">💡 我不明白，教教我</button></div><div id="lesson" class="tip hide"></div><div class="actions"><button id="more" class="hide">还是不会，给我更多提示</button><button id="answer" class="hide">显示参考答案</button></div><div id="answerBox" class="tip hide"></div></section><p class="foot">提示：自动识别可能漏字，翻译可能不完全准确，请核对原题。网页不保证自动解答所有作业；答案仅作学习参考。语音使用手机内置朗读引擎。拍照识别在手机浏览器中运行，并会下载识别组件，翻译会把识别文字发送给第三方翻译服务，请勿上传含个人资料的作业。</p></main><script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js"></script><script>
const $=id=>document.getElementById(id);let lang='zh',current='',translated='',tokens=[],step=0;const cache=new Map();
const chinese=s=>/[\u3400-\u9fff]/.test(s), isCJK=s=>/^[\u3400-\u9fff]+$/.test(s);
function detect(s){let zh=(s.match(/[\u3400-\u9fff]/g)||[]).length,latin=(s.match(/[a-z]/gi)||[]).length;if(zh>latin*.35)return 'zh';let ms=/\b(saya|awak|kamu|mereka|adalah|ialah|yang|dan|atau|tidak|dengan|ini|itu|di|ke|daripada|sebuah|makan|buku|sekolah|berapa|apakah|mengapa|bagaimana|kerana|untuk|pada|boleh|suka|murid|guru|rumah|ayat|isi|tempat|kosong)\b/gi;return (s.match(ms)||[]).length>=1?'ms':'en'}
function pin(s){try{return window.pinyinPro?.pinyin(s,{toneType:'symbol',type:'array'}).join(' ')||''}catch{return ''}}
async function translate(s,from,to='zh-CN'){if(!s.trim())return '';let key=from+'|'+to+'|'+s;if(cache.has(key))return cache.get(key);let pair=from+'|'+to;let url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(s.slice(0,450))+'&langpair='+encodeURIComponent(pair);let r=await fetch(url);if(!r.ok)throw Error('翻译服务暂时不可用');let j=await r.json();if(j.responseStatus!==200||!j.responseData?.translatedText)throw Error('翻译服务未返回结果');let value=j.responseData.translatedText.replace(/&quot;/g,'"').replace(/&#39;/g,"'");cache.set(key,value);return value}
function speak(s,l){if(!('speechSynthesis'in window)){alert('这台设备不支持语音朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang=l==='zh'?'zh-CN':l==='ms'?'ms-MY':'en-US';u.rate=.82;speechSynthesis.speak(u)}
function makeWord(original,meaning,py,mode){let b=document.createElement('button');b.className='word '+(mode==='zh'?'zh':'');b.style.border='none';let p=document.createElement('span');p.className='pinyin';p.textContent=py||' ';b.appendChild(p);if(mode!=='zh'){let z=document.createElement('span');z.className='han';z.textContent=meaning||'…';b.appendChild(z)}let o=document.createElement('span');o.className='orig';o.textContent=original;b.appendChild(o);b.onclick=()=>speak(original,mode);return b}
let ocrWorker=null,ocrTimer=null;
function ocrMessage(message){$('ocrstatus').textContent=message}
async function loadOCR(){
 if(window.Tesseract)return;
 for(const url of ['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','https://unpkg.com/tesseract.js@5/dist/tesseract.min.js']){
  try{await new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=url;el.onload=resolve;el.onerror=()=>reject(Error('网络无法加载识别组件'));document.head.appendChild(el)});if(window.Tesseract)return}catch(e){}
 }
 throw Error('无法加载照片识别组件。请检查网络，或稍后重试。');
}
async function recognizePhoto(file,language='eng'){
 $('source').value='';$('analyze').disabled=true;
 ocrMessage('正在准备识别组件…（需要联网）');
 let timedOut=false;const deadline=setTimeout(()=>{timedOut=true;ocrMessage('识别等待过久。请点击「重新识别」再试，或直接输入题目。');$('analyze').disabled=false;},45000);
 let worker;
 try{
  await loadOCR();if(timedOut)return;
  ocrMessage('正在下载识别资料…第一次可能需要较长时间');
  worker=await Tesseract.createWorker(language,1,{logger:m=>{
   if(timedOut)return;
   const p=typeof m.progress==='number'?' '+Math.round(m.progress*100)+'%':'';
   if(m.status==='recognizing text')ocrMessage('正在识别文字'+p);
   else if(m.status)ocrMessage('准备识别：'+m.status+p);
  }});
  if(timedOut)return;
  const result=await worker.recognize(file);
  if(timedOut)return;
  const value=(result.data?.text||'').trim();$('source').value=value;
  ocrMessage(value?'识别完成！请检查文字是否正确，再按「显示翻译 / 拼音」。':'未识别到文字。请拍清楚一点、靠近纸张重试，或手动输入。');
 }catch(err){if(!timedOut)ocrMessage('照片识别失败：'+(err?.message||String(err))+'。可以重新识别或手动输入。')}
 finally{clearTimeout(deadline);$('analyze').disabled=false;if(worker){try{await worker.terminate()}catch(e){}}}
}
let selectedPhoto=null;
$('file').onchange=e=>{const file=e.target.files?.[0];if(!file)return;selectedPhoto=file;
 $('photo').src=URL.createObjectURL(file);$('photo').style.display='block';
 recognizePhoto(file,$('ocrLang').value);
};
$('retryOCR').onclick=()=>{if(selectedPhoto)recognizePhoto(selectedPhoto,$('ocrLang').value);else alert('请先拍照或上传功课')};
$('analyze').onclick=async()=>{current=$('source').value.trim();if(!current){alert('请先拍照或输入题目');return}lang=detect(current);$('detected').textContent=lang==='zh'?'华文':lang==='ms'?'国文':'英文';$('result').classList.remove('hide');$('words').replaceChildren();$('translated').textContent='处理中…';$('lesson').classList.add('hide');$('more').classList.add('hide');$('answer').classList.add('hide');$('answerBox').classList.add('hide');step=0;let lines=current.split(/\n+/).filter(Boolean);try{if(lang==='zh'){translated=current;$('translated').textContent=current;for(let line of lines){let row=document.createElement('div');row.className='line';for(let ch of line){if(/\s/.test(ch))continue;row.appendChild(makeWord(ch,'',pin(ch),'zh'))}$('words').appendChild(row)}}else{let from=lang==='ms'?'ms':'en';translated=await translate(current,from);$('translated').textContent=translated;let all=lines.flatMap(line=>line.match(/[\p{L}]+(?:['’\-][\p{L}]+)*|\d+|[^\s]/gu)||[]);let words=all.filter(x=>/[\p{L}]/u.test(x));let uniq=[...new Set(words.map(w=>w.toLowerCase()))];let meanings=new Map();let pos=0;for(let i=0;i<uniq.length;i+=8){let batch=uniq.slice(i,i+8);await Promise.all(batch.map(async w=>{try{meanings.set(w,await translate(w,from))}catch{meanings.set(w,'?')}}));pos+=batch.length;$('translated').textContent=translated+'\n（逐字处理 '+pos+'/'+uniq.length+'）'}$('translated').textContent=translated;for(let line of lines){let row=document.createElement('div');row.className='line';for(let word of (line.match(/[\p{L}]+(?:['’\-][\p{L}]+)*|\d+|[^\s]/gu)||[])){let meaning=meanings.get(word.toLowerCase())||'';row.appendChild(makeWord(word,meaning,pin(meaning),lang))}$('words').appendChild(row)}}}catch(e){$('translated').textContent='翻译暂时失败：'+e.message+'。请检查网络，稍后重试。';if(lang==='zh')return;for(let line of lines){let row=document.createElement('div');row.className='line';for(let w of line.split(/\s+/))row.appendChild(makeWord(w,'','',lang));$('words').appendChild(row)}}};
$('speakAll').onclick=()=>speak(current,lang);$('speakZh').onclick=()=>speak(translated,'zh');$('help').onclick=()=>{step=1;$('lesson').classList.remove('hide');$('lesson').textContent='先读一遍题目，找出它在问什么。注意「谁、什么、哪里、为什么、怎样」等关键词，再回到课文或图片寻找线索。';$('more').classList.remove('hide')};$('more').onclick=()=>{step=2;$('lesson').textContent='第二步：把题目分成几个小部分，找出要回答的重点。试着先自己说出答案，再写下来。';$('more').classList.add('hide');$('answer').classList.remove('hide')};$('answer').onclick=()=>{$('answerBox').classList.remove('hide');$('answerBox').textContent='这是一款翻译学习工具，目前没有接入自动解题服务，因此不能可靠地产生这道题的标准答案。请先根据题目和课文尝试作答，或让家长一起检查。'};


</script></body></html>
