<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>功课翻译小助手</title><style>body{font-family:system-ui,'Noto Sans SC',sans-serif;background:#f7f9fc;color:#182333;margin:0}main{max-width:680px;margin:auto;padding:20px 16px 70px}h1{font-size:25px;margin:12px 0 4px}.sub{color:#64748b;margin:0 0 20px}.panel{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 18px #1b3a5b0b}button,.upload{border:0;border-radius:13px;padding:14px 18px;font-size:16px;font-weight:650;cursor:pointer;background:#e9f5ed;color:#176b40;display:inline-block}button.primary,.upload.primary{background:#16834b;color:white;width:100%;box-sizing:border-box;text-align:center}button:disabled{opacity:.5}textarea{box-sizing:border-box;width:100%;border:1px solid #d9e0e8;border-radius:12px;padding:12px;font-size:17px;min-height:110px;resize:vertical}#photo{max-width:100%;max-height:240px;object-fit:contain;border-radius:12px;margin:12px auto;display:none}.hide{display:none!important}.line{display:flex;flex-wrap:wrap;gap:12px 10px;align-items:end;line-height:1.5;margin:12px 0 20px}.word{display:flex;flex-direction:column;align-items:center;gap:3px;background:#f5f8fa;border-radius:9px;padding:7px 9px;max-width:100%;overflow-wrap:anywhere}.pinyin{color:#16834b;font-size:13px;min-height:18px}.han{color:#1d6d4c;font-size:15px}.orig{font-size:20px;font-weight:650}.zh .orig{font-size:23px}.muted{color:#667789;font-size:13px}.status{font-size:14px;color:#54687a;white-space:pre-wrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}h2{font-size:18px}#translated{font-size:18px;line-height:1.8}.tip{background:#f1f8ff;padding:13px;border-radius:12px;line-height:1.7}.foot{color:#64748b;font-size:12px;line-height:1.7}input[type=file]{display:none}</style></head><body><main><h1>📚 功课翻译小助手</h1><p class="sub">拍功课 · 看意思 · 点字听发音</p><section class="panel"><label class="upload primary" for="file">📷 拍照或上传功课</label><input id="file" type="file" accept="image/*" capture="environment"><img id="photo" alt="功课照片"><p id="ocrstatus" class="status">也可以直接在下面输入或修改题目。</p><textarea id="source" placeholder="拍照后会识别文字，也可以自己输入华文、英文或国文……"></textarea><div class="actions"><button id="analyze" class="primary">✨ 显示翻译 / 拼音</button></div></section><section id="result" class="panel hide"><h2>📖 逐字学习 <span id="detected" class="muted"></span></h2><div id="words"></div><h2>整句中文意思</h2><div id="translated"></div><div class="actions"><button id="speakAll">🔊 朗读原文</button><button id="speakZh">🔊 朗读中文</button></div><p class="muted">点击上方任意单词或汉字，也可以听发音。</p><div class="actions"><button id="help">💡 我不明白，教教我</button></div><div id="lesson" class="tip hide"></div><div class="actions"><button id="more" class="hide">还是不会，给我更多提示</button><button id="answer" class="hide">显示参考答案</button></div><div id="answerBox" class="tip hide"></div></section><p class="foot">提示：自动识别可能漏字，翻译可能不完全准确，请核对原题。网页不保证自动解答所有作业；答案仅作学习参考。语音使用手机内置朗读引擎。拍照识别会下载识别组件，翻译会把识别文字发送给第三方翻译服务，请勿上传含个人资料的作业。</p></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js"></script><script src="app.js"></script></body></html>
